# separately if you need the ESM-IF1 objective.
# The nvidia-*/triton/cuda-* pins are Linux+CUDA specific; on CPU/macOS install
# from pyproject.toml instead.
#
# Recreate:   python3.13 -m venv .venv && .venv/bin/pip install -r requirements.lock && .venv/bin/pip install -e .
