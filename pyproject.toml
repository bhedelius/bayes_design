[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayes-design"
version = "0.1.0"
description = "Bayesian protein sequence design via probability-model ratios (BayesDesign)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Jacob A. Stern" },
    { name = "Dennis Della Corte", email = "dennis.dellacorte@byu.edu" },
]
maintainers = [
    { name = "Bryce E. Hedelius", email = "bhedelius@gmail.com" },
]
keywords = [
    "protein design",
    "inverse folding",
    "ProteinMPNN",
    "conformational specificity",
    "deep learning",
    "structural biology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core: everything a design run needs (bayes_design, fold_specificity,
# protein_mpnn / ligand_mpnn / soluble_mpnn). Heavier, task-specific deps live in
# the extras below.
dependencies = [
    "torch",
    "numpy",
    "biopython",
    "prody",
    # ProtXLNet denominator for the BayesDesign objective.
    "transformers",
    "tokenizers",
    "sentencepiece",
    # transformers>=5 converts ProtXLNet's SentencePiece tokenizer via protobuf;
    # without it, loading falls back to a tiktoken path that cannot parse the
    # SentencePiece model and raises. Harmless (unused) on transformers 4.x.
    "protobuf",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]
# XLNet fine-tuning (train_xlnet.py); transformers is already a core dep.
train = ["datasets"]
# Analysis/plots, the scRMSD pipeline, and the trRosetta comparison model.
experiments = ["matplotlib", "pandas", "scipy", "tqdm", "tr-rosetta-pytorch"]
# ESM-IF1 inverse-folding objective (esm_if1 / bayes_design_esm_if1 / ensemble).
esm = ["fair-esm", "torch-geometric", "torch-scatter", "biotite"]

[project.urls]
Homepage = "https://github.com/dellacortelab/bayes_design"
Repository = "https://github.com/dellacortelab/bayes_design"
Paper = "https://doi.org/10.1038/s41598-023-42032-1"

[project.scripts]
bayes-design = "bayes_design.cli:main"
bayes-design-experiment = "bayes_design.experiment_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bayes_design"]
# Keep the wheel slim: ship code + only the ProteinMPNN weight the default mode
# loads. Training data, notebooks, and download-on-demand weights are excluded.
exclude = [
    "**/*.ipynb",
    "**/*.csv",
    "src/bayes_design/ligand_mpnn/model_params/**",
    "src/bayes_design/protein_mpnn/vanilla_model_weights/v_48_002.pt",
    "src/bayes_design/protein_mpnn/vanilla_model_weights/v_48_010.pt",
    "src/bayes_design/protein_mpnn/vanilla_model_weights/v_48_020.pt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Exclude vendored model code, the adapted HuggingFace training script, and the
# faithfully-ported research experiments (kept as-is for provenance, not maintained
# to lint standards).
extend-exclude = [
    "src/bayes_design/protein_mpnn",
    "src/bayes_design/ligand_mpnn",
    "src/bayes_design/train_xlnet.py",
    "src/bayes_design/experiments/scrmsd_experiment.py",
    "src/bayes_design/experiments/make_chimerax_scripts.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long argparse help strings are intentional; don't enforce line length.
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
exclude = [
    "src/bayes_design/protein_mpnn/",
    "src/bayes_design/ligand_mpnn/",
    "src/bayes_design/train_xlnet.py",
    "src/bayes_design/experiments/scrmsd_experiment.py",
    "src/bayes_design/experiments/make_chimerax_scripts.py",
]
